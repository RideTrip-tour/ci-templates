name: Python Ruff

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      pip-version:
        type: string
        default: "25.0.1"
      requirements-file:
        type: string
        default: "requirements.test.txt"

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}
      - name: Install pip
        env:
          PIP_VERSION: ${{ inputs.pip-version }}
        run: python -m pip install "pip==$PIP_VERSION"
      - name: Install dependencies
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: python -m pip install -r "$REQUIREMENTS_FILE"
      - name: Ruff lint
        run: |
          ruff check --select F,E9 .
          ruff check .
      - name: Ruff format
        run: ruff format --check .
