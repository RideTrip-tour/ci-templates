name: Docker Swarm Alembic Check

on:
  workflow_call:
    inputs:
      service-name:
        type: string
        required: true
      image-ref:
        type: string
        required: true
      data-network:
        type: string
        default: data-network
      db-secret-prefix:
        description: Prefix used by Docker Swarm secret names, e.g. DB_AUTH_SERVICE
        type: string
        required: true
      environment:
        type: string
        default: DEV
    secrets:
      SWARM_SSH_PRIVATE_KEY:
        required: true
      SWARM_HOST:
        required: true
      SWARM_USER:
        required: true
      SWARM_KNOWN_HOSTS:
        required: true
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  alembic-check:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Trust pinned SSH host key
        env:
          KNOWN_HOSTS: ${{ secrets.SWARM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SWARM_SSH_PRIVATE_KEY }}

      - name: Configure remote Docker
        env:
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
        run: |
          set -euo pipefail
          docker context create swarm --docker "host=ssh://${SWARM_USER}@${SWARM_HOST}"
          docker --context swarm info

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check Alembic autogenerate state
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          SERVICE_NAME: ${{ inputs.service-name }}
          DATA_NETWORK: ${{ inputs.data-network }}
          DB_SECRET_PREFIX: ${{ inputs.db-secret-prefix }}
        run: |
          set -euo pipefail
          [[ "$DB_SECRET_PREFIX" =~ ^[A-Z][A-Z0-9_]*$ ]] || {
            echo "Invalid DB secret prefix"
            exit 1
          }
          job_name="${SERVICE_NAME}-alembic-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker --context swarm service rm "$job_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup

          secret_args=()
          for suffix in HOST PORT NAME USER PASS; do
            secret="${DB_SECRET_PREFIX}_${suffix}"
            secret_args+=(--secret "$secret")
          done

          if ! docker --context swarm service create \
            --name "$job_name" \
            --detach=false \
            --restart-condition none \
            --mode replicated-job \
            --network "$DATA_NETWORK" \
            "${secret_args[@]}" \
            --with-registry-auth \
            --entrypoint /bin/sh \
            "$IMAGE_REF" \
            -c 'exec alembic check'; then
            docker --context swarm service logs "$job_name" || true
            exit 1
          fi

          docker --context swarm service logs "$job_name" || true
