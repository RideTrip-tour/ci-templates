name: Python Alembic Check

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"

      requirements-file:
        type: string
        default: requirements.txt

      alembic-config:
        type: string
        default: alembic.ini

      database-url:
        type: string
        default: postgresql+asyncpg://test:test@localhost:5432/test

      postgres-image:
        type: string
        default: postgres:18

      working-directory:
        type: string
        default: "."

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ inputs.requirements-file }}

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ inputs.database-url }}
        run: alembic -c ${{ inputs.alembic-config }} upgrade head

      - name: Check model changes
        env:
          DATABASE_URL: ${{ inputs.database-url }}
        run: alembic -c ${{ inputs.alembic-config }} check